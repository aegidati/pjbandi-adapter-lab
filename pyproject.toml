[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adapter-lab"
version = "0.1.0"
description = "Lab repository for discovering, prototyping, and validating ingestion adapters for public funding sources"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pypdf>=4.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
adapter-lab = "adapter_lab.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
